name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Ci_Passw0rd!x9
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci_Passw0rd!x9 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      FACTORY_CONNECTION: Server=localhost,1433;Database=FactoryApp;User Id=sa;Password=Ci_Passw0rd!x9;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build --nologo -c Release
      - run: dotnet test --nologo -c Release --no-build
      - run: dotnet tool install --global dotnet-ef --version 10.0.*
      - run: dotnet ef database update --project FactoryApp.Domain
